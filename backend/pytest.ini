[pytest]
testpaths = tests
python_files = test_*.py *_test.py *_unit.py *_integration.py *_e2e.py items.py items_api.py items_types.py items_validation.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --cov=. --cov-report=term-missing --cov-fail-under=60
markers =
    unit: Fast isolated tests (no real DB/network/services)
    integration: Tests with app + DB or multiple components
    e2e: End-to-end tests across full stack or external processes
